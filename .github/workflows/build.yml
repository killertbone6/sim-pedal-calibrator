name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:      # lets you build on demand from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests -q

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      # --onefile   : a single .exe, nothing to install
      # --windowed  : no console window behind the app
      # --add-data  : bundle the window icon (";" is the Windows separator)
      - name: Build PedalCalibrator.exe
        run: >
          pyinstaller --onefile --windowed
          --name PedalCalibrator
          --icon docs/icon.ico
          --add-data "pedalcal/icon.png;pedalcal"
          run_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: PedalCalibrator-windows
          path: dist/PedalCalibrator.exe

      # On a version tag, publish a release with the .exe attached so people
      # can download and run it without installing anything.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PedalCalibrator.exe
          generate_release_notes: true
