name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:      # lets you build on demand from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # A GUI test that gets stuck waits forever by nature - there is no output
    # to time out on. GitHub's default would let that run for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # "python -m pytest" (not bare "pytest") so the repo root lands on
      # sys.path and "import pedalcal" resolves.
      - run: python -m pytest tests -q

      # The GUI test opens the real window, so it needs Tk and a display.
      # Xvfb is a display server with no screen attached; without it Tk exits
      # with "no display name and no $DISPLAY environment variable" and the
      # whole window layer would go untested. python3-tk is here for the Tcl
      # and Tk shared libraries it pulls in - the Python installed by
      # setup-python has _tkinter built in, but it loads libtk at run time.
      - name: Install a display and the Tk libraries
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb python3-tk

      - run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # The test screenshots itself where ImageMagick is available and skips
      # that quietly where it isn't, so nothing else is needed here.
      - name: Smoke-test the window
        timeout-minutes: 5
        run: xvfb-run -a python tests/smoke_gui.py

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      # --onefile  : a single .exe, nothing to install
      # --windowed : no console window behind the app
      # The window icon is embedded in the source, so there are no data files
      # to bundle here.
      # pystray picks its backend at import time, so PyInstaller's static
      # analysis never sees the Windows one - it has to be named explicitly.
      - name: Build Lord3DPedalCalibrator.exe
        run: >
          pyinstaller --onefile --windowed
          --name Lord3DPedalCalibrator
          --icon docs/icon.ico
          --hidden-import pystray._win32
          run_app.py

      - uses: actions/upload-artifact@v5
        with:
          name: Lord3DPedalCalibrator-windows
          path: dist/Lord3DPedalCalibrator.exe

      # On a version tag, publish a release with the .exe attached so people
      # can download and run it without installing anything.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lord3DPedalCalibrator.exe
          generate_release_notes: true
