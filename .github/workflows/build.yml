name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:      # lets you build on demand from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # "python -m pytest" (not bare "pytest") so the repo root lands on
      # sys.path and "import pedalcal" resolves.
      - run: python -m pytest tests -q

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      # --onefile  : a single .exe, nothing to install
      # --windowed : no console window behind the app
      # The window icon is embedded in the source, so there are no data files
      # to bundle here.
      - name: Build PedalCalibrator.exe
        run: >
          pyinstaller --onefile --windowed
          --name PedalCalibrator
          --icon docs/icon.ico
          run_app.py

      - uses: actions/upload-artifact@v5
        with:
          name: PedalCalibrator-windows
          path: dist/PedalCalibrator.exe

      # On a version tag, publish a release with the .exe attached so people
      # can download and run it without installing anything.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PedalCalibrator.exe
          generate_release_notes: true
