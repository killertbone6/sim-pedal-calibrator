[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord3d-pedal-calibrator"
version = "0.4.0"
description = "Lord3D pedal calibrator: travel, response curve and deadzone for sim racing pedals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
pedalcal = "pedalcal.__main__:main"

[tool.setuptools]
packages = ["pedalcal"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so "import pedalcal" works whether the tests
# are started as "pytest" or "python -m pytest".
pythonpath = ["."]
