[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-pedal-calibrator"
version = "0.1.0"
description = "Detect a sim racing pedal controller on a COM port and set per-axis min/max calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.scripts]
pedalcal = "pedalcal.__main__:main"

[tool.setuptools]
packages = ["pedalcal"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so "import pedalcal" works whether the tests
# are started as "pytest" or "python -m pytest".
pythonpath = ["."]
